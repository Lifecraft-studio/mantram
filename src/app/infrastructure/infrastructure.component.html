<div #largeImage class="bigImage"> 
    <img (click)="prevImage()"  class="left-arrow-img" src="/assets/icons/left-arrow.svg">
    @if (!selectedImage) {
    <div class="lightbox" (click)="closeImage()">
        <img [src]="images[currentIndex]" alt="Selected Image">
    </div>
    }@else{
    <div class="lightbox" (click)="closeImage()">
        <img [src]="images[currentIndex]" alt="Selected Image">
    </div>
    }
    <img (click)="nextImage()"  class="right-arrow-img" src="/assets/icons/right-arrow.svg">
</div>

<div class="gallery">
    @for (img of images; track $index) {
    <div class="image">
        <img [src]="img" alt="Gallery Image" (click)="openImage(img)">
    </div>
    }

</div>
