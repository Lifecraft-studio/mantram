<header [ngClass]="{'is-sticky': isSticky}">
  <div class="container">
    <button class="btn-toggle" (click)="showMenu = !showMenu">
      <span class="hamburger"></span>
    </button>
    <a href="/"> <img [src]="!isSticky ?  '/assets/logo.svg' : '/assets/logo-white.svg'" height="50px" /> </a>
    <nav class="nav" [ngClass]="{ show: showMenu }">
      <ul class="menu">
        <li class="menu-item"><a href="/about">About</a></li>
        <li class="menu-item"><a href="">Products</a></li>
        <li class="menu-item"><a href="">Clients</a></li>
        <li class="menu-item"><a href="">Infrastructure</a></li>
      </ul>
    </nav>
  </div>
</header>
