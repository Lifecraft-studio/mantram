<header [ngClass]="{'is-sticky': isSticky}">
  <div class="container">
    <button class="btn-toggle" (click)="showMenu = !showMenu">
      <span class="hamburger"></span>
    </button>
    <a href="/"> <img [src]="!isSticky ?  '/assets/logo.svg' : '/assets/logo-white.svg'" height="50px" /> </a>
    <nav class="nav" [ngClass]="{ show: showMenu }">
      <ul class="menu">
        <li class="menu-item"><a routerLink="about">About</a></li>
        <li class="menu-item has-submenu"><a>Products</a>
          <ul class="submenu">
            <li class="submenu-item"><a routerLink="/products/aerial">LT Aerial Cable</a></li>
            <li class="submenu-item has-submenu">
              <a routerLink="conductors" class="conductor-submenu" routerLink="/products/transmission">Conductors</a>
              <ul class="submenu">
                <li class="submenu-item"><a routerLink="aab" routerLink="/products/acsr">ACSR</a></li>
                <li class="submenu-item"><a routerLink="aac" routerLink="/products/aaa">AAA</a></li>
                <li class="submenu-item"><a routerLink="aa" routerLink="/products/aa">AA</a></li>
              </ul>
            </li>
          </ul>
        </li>
        <li class="menu-item"><a routerLink="investors">Investors</a></li>
        <li class="menu-item"><a routerLink="infrastructure">Infrastructure</a></li>
      </ul>
    </nav>
  </div>
</header>
